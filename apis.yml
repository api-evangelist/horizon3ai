aid: horizon3ai
name: Horizon3.ai
description: >-
  Horizon3.ai is a cybersecurity company whose NodeZero platform delivers autonomous
  penetration testing and continuous security posture management. NodeZero safely
  attacks your internal, external, cloud, and hybrid environments the way a real
  adversary would, proving exploitable attack paths, prioritizing the fixes that
  matter, and verifying that remediations actually work. Horizon3.ai exposes a
  publicly documented GraphQL API (the NodeZero API) plus an h3-cli command-line
  tool and a hosted Model Context Protocol (MCP) server, letting teams schedule
  pentests, retrieve findings, weaknesses, attack paths, credentials, and host
  inventory, and wire results into CI/CD, ticketing (Jira, ServiceNow), and agentic
  workflows. NodeZero Federal is FedRAMP High authorized for public-sector use.
