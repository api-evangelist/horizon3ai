source: https://docs.horizon3.ai/portal/features/mcp/h3_hosted/
server:
  name: horizon3ai
  vendor: Horizon3.ai
  transport: streamable-http
  description: >-
    Horizon3.ai-hosted Model Context Protocol server exposing NodeZero data and
