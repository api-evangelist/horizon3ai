    tokens are short-lived JWTs expiring after 1 hour.
  endpoints:
  - region: US
    url: https://mcp.horizon3ai.com/mcp
  - region: EU
    url: https://mcp.horizon3ai.eu/mcp
  - region: FedRAMP High
    url: https://mcp.gov-horizon3ai.com/mcp
  auth:
    type: oauth2.1
    flow: authorization_code
    pkce: S256
    authorization_server: https://oauth-proxy.horizon3ai.com
    authorization_endpoint: https://oauth-proxy.horizon3ai.com/authorize
    token_endpoint: https://oauth-proxy.horizon3ai.com/token
    registration_endpoint: https://oauth-proxy.horizon3ai.com/register
    scopes: [read, write]
    redirect_uris: loopback (localhost / 127.0.0.1, any port)
    token_ttl_seconds: 3600
  well_known:
  - well-known/horizon3ai-mcp-oauth-authorization-server.json
  - well-known/horizon3ai-mcp-oauth-protected-resource.json
  - well-known/horizon3ai-mcp-openid-configuration.json
  clients_supported:
  - VS Code
  - Claude Code
  - Gemini CLI
  - Windsurf
notes: >-
  Official, published, hosted remote MCP server. Tool inventory is not enumerated in
